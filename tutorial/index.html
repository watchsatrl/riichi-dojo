<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本麻将 · 零基础入门</title>
<meta name="description" content="面向完全零基础读者的日本麻将（立直麻将）交互式教程">
<style>/* ═══════════════════════════════════════════════════════════════
   日本麻将教程 · 样式表
   设计取向：暖纸底色 + 高可读性正文字号，长时间阅读不累。
   牌面一律内联 SVG（见 ui-tiles.js），不依赖任何外部资源。
   ═══════════════════════════════════════════════════════════════ */

:root {
  --paper:      #f6f3ea;
  --paper-2:    #fbf9f3;
  --card:       #fffefb;
  --ink:        #221f1a;
  --ink-2:      #565044;
  --ink-3:      #8d8574;
  --line:       #e3dccb;
  --line-2:     #cec4ac;

  --red:        #b03a2e;
  --red-soft:   #fbeceb;
  --green:      #2f6b4f;
  --green-soft: #e9f2ec;
  --blue:       #1f5fa8;
  --blue-soft:  #eaf1f9;
  --amber:      #9c6c14;
  --amber-soft: #fbf3e0;

  --radius:     10px;
  --shadow:     0 1px 2px rgba(48,36,12,.06), 0 4px 14px rgba(48,36,12,.05);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
  font-size: 16.5px;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ── 骨架布局 ─────────────────────────────────────────────────── */
.layout { display: flex; align-items: flex-start; min-height: 100vh; }

.sidebar {
  flex: 0 0 252px; width: 252px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--paper-2);
  border-right: 1px solid var(--line);
  padding: 26px 0 40px;
}

.sidebar-title {
  padding: 0 22px 4px;
  font-size: 15px; font-weight: 700; letter-spacing: .06em;
  color: var(--ink);
}
.sidebar-sub {
  padding: 0 22px 18px;
  font-size: 12.5px; color: var(--ink-3); letter-spacing: .04em;
  border-bottom: 1px solid var(--line);
  margin-bottom: 12px;
}

.nav-group { padding: 10px 22px 4px; font-size: 11.5px; font-weight: 700; letter-spacing: .12em; color: var(--ink-3); }

.nav-item {
  display: flex; gap: 10px; align-items: baseline;
  padding: 7px 22px 7px 20px;
  font-size: 14.5px; color: var(--ink-2);
  cursor: pointer; border: 0; background: none; width: 100%;
  text-align: left; font-family: inherit; line-height: 1.5;
  text-decoration: none;
  border-left: 3px solid transparent;
  transition: background .12s, color .12s;
}
.nav-item > span:last-child { flex: 1 1 auto; }
.nav-wip {
  display: inline-block; margin-left: 7px; padding: 0 5px;
  font-size: 10.5px; letter-spacing: .06em; border-radius: 4px;
  background: #e8e0cd; color: var(--ink-3); vertical-align: 1px;
}
.nav-item:hover { background: #f2ece0; color: var(--ink); }
.nav-item.active { background: #efe8da; color: var(--ink); font-weight: 650; border-left-color: var(--red); }
.nav-num { flex: 0 0 auto; font-variant-numeric: tabular-nums; color: var(--ink-3); font-size: 13px; min-width: 15px; }
.nav-item.active .nav-num { color: var(--red); }

.content { flex: 1 1 auto; min-width: 0; max-width: 900px; padding: 42px 48px 140px; }

/* ── 正文排版 ─────────────────────────────────────────────────── */
h1 { font-size: 27px; line-height: 1.4; margin: 0 0 6px; letter-spacing: -.01em; }
h2 { font-size: 21px; margin: 42px 0 12px; padding-top: 20px; border-top: 1px solid var(--line); letter-spacing: -.005em; }
h3 { font-size: 17.5px; margin: 28px 0 8px; color: var(--ink); }
h2:first-of-type, h3:first-of-type { border-top: 0; padding-top: 0; margin-top: 28px; }

.lede { font-size: 15.5px; color: var(--ink-2); margin: 0 0 8px; }
.lesson-head { margin-bottom: 26px; }
.lesson-head .kicker {
  display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .14em;
  color: var(--red); margin-bottom: 8px;
}

p { margin: 13px 0; }
ul, ol { margin: 13px 0; padding-left: 26px; }
li { margin: 6px 0; }
strong { font-weight: 680; }
code {
  font-family: "Cascadia Mono", Consolas, "SF Mono", monospace;
  font-size: .89em; background: #efe9db; padding: 1px 5px; border-radius: 4px;
  border: 1px solid var(--line);
}
a { color: var(--blue); }

/* ── 牌面 ─────────────────────────────────────────────────────── */
svg.mj-tile { display: inline-block; vertical-align: middle; flex: 0 0 auto; }
svg.mj-tile.xs { width: 19px; }
svg.mj-tile.sm { width: 25px; }
svg.mj-tile.md { width: 34px; }
svg.mj-tile.lg { width: 46px; }
svg.mj-tile.xl { width: 62px; }
svg.mj-tile.dim { opacity: .34; filter: saturate(.4); }
svg.mj-tile.hl { filter: drop-shadow(0 0 0 2px var(--amber)); }

.mj-kn { font-family: "Yu Mincho", "YuMincho", "MS Mincho", "SimSun", "Songti SC", "Noto Serif CJK SC", serif; }

.hand {
  display: inline-flex; gap: 2px; align-items: flex-end;
  padding: 7px 9px; background: #e7e1d1; border: 1px solid var(--line-2);
  border-radius: 8px; flex-wrap: wrap; vertical-align: middle;
}
.hand.plain { background: none; border: 0; padding: 0; }
.hand + .hand { margin-left: 10px; }
.tile-row { display: flex; flex-wrap: wrap; gap: 22px 30px; align-items: flex-end; margin: 20px 0; }
.tile-row > figure { margin: 0; text-align: center; }
.tile-row figcaption { font-size: 12.5px; color: var(--ink-3); margin-top: 7px; letter-spacing: .03em; }

/* 拆解展示：面子 + 面子 + …… 视觉上要能读出「4 + 1」这个句式 */
.tile-row.breakdown { gap: 13px; margin: 22px 0 26px; }
.tile-row.breakdown figcaption { white-space: nowrap; }
.bd-sep {
  align-self: flex-end; padding-bottom: 30px;
  color: var(--ink-3); font-size: 16px; font-weight: 600; user-select: none;
}

.fig-note { font-size: 13px; color: var(--ink-3); margin: -14px 0 20px; }

.formula {
  text-align: center; font-size: 17px; line-height: 2;
  padding: 14px 18px; background: #f1ebdd; border-radius: var(--radius);
  margin: 20px 0; font-variant-numeric: tabular-nums;
}

.inline-hand { display: inline-flex; gap: 1px; vertical-align: middle; }

/* 副露与暗牌分两行 —— 必须能一眼看出这是两堆东西 */
.hand-with-melds {
  display: inline-flex; flex-direction: column; gap: 6px;
  margin: 10px 0; vertical-align: middle;
}
.hw-row { display: flex; align-items: center; gap: 10px; }
.hw-label {
  flex: 0 0 84px; font-size: 12.5px; color: var(--ink-3);
  letter-spacing: .02em; white-space: nowrap;
}
.hw-none { font-size: 13px; color: var(--ink-3); }

/* 桌面座次图 */
svg.table-diagram { display: block; width: 100%; max-width: 470px; margin: 26px auto 4px; }

/* 牌河（舍牌区）：用更暗的底色和正手牌区分开，避免读者误以为是手里还有的牌 */
.pond-row { margin: 18px 0 22px; }
.pond { margin: 0; text-align: center; }
.pond .hand { background: #ddd6c2; border-color: #bdb298; }
.pond figcaption { font-size: 12.5px; color: var(--ink-3); margin-top: 7px; }

/* ── 提示框 ───────────────────────────────────────────────────── */
.note, .tip, .warn, .key {
  border-radius: var(--radius); padding: 14px 18px; margin: 20px 0;
  border-left: 4px solid; font-size: 15.5px;
}
.note { background: var(--blue-soft);  border-color: var(--blue); }
.tip  { background: var(--green-soft); border-color: var(--green); }
.warn { background: var(--amber-soft); border-color: var(--amber); }
.key  { background: #f3efe3; border-color: var(--ink); }
.note > :first-child, .tip > :first-child, .warn > :first-child, .key > :first-child { margin-top: 0; }
.note > :last-child,  .tip > :last-child,  .warn > :last-child,  .key > :last-child  { margin-bottom: 0; }
.note::before, .tip::before, .warn::before, .key::before {
  display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .13em; margin-bottom: 4px;
}
.note::before { content: "说明";   color: var(--blue); }
.tip::before  { content: "要点";   color: var(--green); }
.warn::before { content: "易错";   color: var(--amber); }
.key::before  { content: "记住";   color: var(--ink-2); }

/* ── 表格 ─────────────────────────────────────────────────────── */
table { border-collapse: collapse; width: 100%; margin: 20px 0; font-size: 15px; }
th, td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; vertical-align: top; }
th { background: #f1ebdd; font-weight: 660; font-size: 14.5px; }
tbody tr:nth-child(even) { background: #fdfcf7; }

/* 算符明细表：数字右对齐并用等宽数字，方便读者逐行相加 */
.fu-table { max-width: 470px; }
.fu-table td.num, .fu-table th.num { text-align: right; width: 96px; font-variant-numeric: tabular-nums; font-weight: 650; }

/* 点数速查表：数字列必须等宽右对齐，否则读者没法纵向扫读 */
.formula.big { font-size: 19px; }
.score-table { font-size: 14px; }
.score-table td.num, .score-table th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.score-table td:first-child { white-space: nowrap; }
.score-table th { font-size: 13.5px; }

/* 役种图鉴表 */
.yaku-table { font-size: 14px; }
.yaku-table td.han, .yaku-table th.han { text-align: center; white-space: nowrap; width: 82px; font-weight: 650; }
.yaku-table .ja { font-size: 11.5px; color: var(--ink-3); font-weight: 400; }
.tag { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 20px; white-space: nowrap; }
.tag-closed { background: var(--red-soft); color: var(--red); }
.tag-down { background: var(--amber-soft); color: var(--amber); }
.tag-free { background: var(--green-soft); color: var(--green); }

/* ── 「能不能和」判定器 ────────────────────────────────────────── */
.judge {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--card); padding: 20px 22px; margin: 26px 0;
  box-shadow: var(--shadow);
}
.judge-title { font-weight: 680; margin-bottom: 14px; font-size: 16px; }
.judge-board { display: flex; flex-direction: column; gap: 9px; margin-bottom: 16px; }
.judge-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.judge-tag {
  flex: 0 0 92px; font-size: 12.5px; color: var(--ink-3); letter-spacing: .03em;
}
.judge-controls, .judge-pond-opts { display: flex; gap: 8px; flex-wrap: wrap; }
.judge-controls { margin-bottom: 14px; }
.judge-pond-block { margin-bottom: 16px; }
.judge-pond-label { font-size: 13px; color: var(--ink-3); margin-bottom: 8px; }
.btn.on { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); font-weight: 650; }
.jd-pond { padding: 4px 9px; line-height: 0; }
.jd-pond svg { pointer-events: none; }

.judge-result {
  border-top: 1px dashed var(--line-2); padding-top: 15px;
}
.jd-verdict { font-size: 17px; font-weight: 700; margin-bottom: 10px; }
.jd-verdict.yes { color: var(--green); }
.jd-verdict.no { color: var(--red); }
.jd-line { font-size: 14.5px; margin: 4px 0; }
.jd-line .bad { color: var(--red); font-weight: 650; }
.jd-yaku {
  display: inline-block; background: var(--green-soft); color: var(--green);
  border-radius: 5px; padding: 1px 8px; margin: 2px 4px 2px 0; font-size: 13.5px;
}
.jd-reasons { margin: 8px 0 0; padding-left: 20px; font-size: 14px; color: var(--ink-2); }
.jd-reasons li { margin: 3px 0; }

/* ── 「该打哪张」训练器 ────────────────────────────────────────── */
.dt {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--card); padding: 20px 22px; margin: 26px 0;
  box-shadow: var(--shadow);
}
.dt-title { font-weight: 680; margin-bottom: 12px; font-size: 16px; }
.dt-prompt { font-size: 13.5px; color: var(--ink-3); margin-bottom: 10px; }
.dt-hand { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 16px; }
.dt-tile {
  border: 1px solid transparent; background: none; padding: 2px; border-radius: 7px;
  cursor: pointer; line-height: 0; transition: transform .1s, border-color .12s, background .12s;
}
.dt-tile:hover { border-color: var(--blue); background: var(--blue-soft); transform: translateY(-3px); }
.dt-tile.picked { border-color: var(--amber); background: var(--amber-soft); }
.dt-tile.optimal { border-color: var(--green); background: var(--green-soft); }
.dt-result:empty { display: none; }
.dt-verdict { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
.dt-verdict.yes { color: var(--green); }
.dt-verdict.no { color: var(--amber); }
.dt-table { margin: 0 0 10px; font-size: 14px; }
.dt-table td, .dt-table th { vertical-align: middle; }
.dt-table td.nowrap { white-space: nowrap; }
.dt-table td.num, .dt-table th.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }
.dt-table tr.best { background: var(--green-soft) !important; }
.dt-uke { display: inline-flex; align-items: center; gap: 1px; margin: 0 7px 2px 0; }
.dt-uke b { font-size: 12px; color: var(--ink-2); }
.dt-none { color: var(--ink-3); font-size: 13.5px; }
.dt-note { font-size: 13px; color: var(--ink-3); }

/* ── 常见错误清单 ─────────────────────────────────────────────── */
.bug-table { font-size: 14.5px; }
.bug-table td { vertical-align: top; }
.bug-table td:first-child { width: 226px; }
.bug-table td:nth-child(2) { width: 32%; color: var(--ink-2); }
.bug-table .ref { font-size: 12px; color: var(--ink-3); }
.checklist { background: #f3efe3; border-radius: var(--radius); padding: 6px 22px 6px 6px; margin: 20px 0; }
.checklist ol { margin: 14px 0; }
.checklist li { margin: 9px 0; }

/* ── 练习组件 ─────────────────────────────────────────────────── */
.ex {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--card); padding: 20px 22px; margin: 26px 0;
  box-shadow: var(--shadow);
}
.ex::before { content: "练习"; display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .13em; color: var(--red); margin-bottom: 6px; }
.ex-q { font-weight: 620; margin-bottom: 14px; }
.ex-q .hand { margin: 8px 0; }
.ex-opts { display: flex; flex-wrap: wrap; gap: 8px; }
.ex-opt {
  border: 1px solid var(--line-2); background: #fff; color: var(--ink);
  border-radius: 8px; padding: 8px 15px; cursor: pointer; font: inherit; font-size: 15px;
  transition: border-color .12s, background .12s;
}
.ex-opt:hover:not(:disabled) { border-color: var(--blue); background: var(--blue-soft); }
.ex-opt:disabled { cursor: default; }
.ex-opt.ok { background: var(--green-soft); border-color: var(--green); color: var(--green); font-weight: 650; }
.ex-opt.no { background: var(--red-soft);   border-color: var(--red);   color: var(--red); }
.ex-opt.picked { border-color: var(--blue); background: var(--blue-soft); box-shadow: inset 0 0 0 1px var(--blue); }
.ex-opt svg { pointer-events: none; }
.ex-fb { margin-top: 14px; padding: 11px 15px; border-radius: 8px; display: none; font-size: 15.5px; }
.ex-fb.show { display: block; }
.ex-fb.ok { background: var(--green-soft); border-left: 3px solid var(--green); }
.ex-fb.no { background: var(--red-soft);   border-left: 3px solid var(--red); }
.ex-fb > :first-child { margin-top: 0; }
.ex-fb > :last-child  { margin-bottom: 0; }
.ex-actions { margin-top: 14px; display: flex; gap: 10px; }
.btn {
  border: 1px solid var(--line-2); background: #fff; color: var(--ink-2);
  border-radius: 8px; padding: 6px 14px; cursor: pointer; font: inherit; font-size: 14px;
}
.btn:hover { border-color: var(--ink-3); color: var(--ink); }

/* ── 响应式 ───────────────────────────────────────────────────── */
@media (max-width: 860px) {
  .layout { flex-direction: column; }
  .sidebar { position: static; flex: none; width: 100%; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
  .content { padding: 26px 20px 90px; }
  body { font-size: 16px; }
}

@media print {
  .sidebar, .ex-actions { display: none; }
  .content { max-width: none; padding: 0; }
  .ex { break-inside: avoid; }
}
</style>
</head>

<div id="app"></div>
<script>(function () {
  "use strict";
  /* ═══ ui/tiles.js ═══ */
  const __mod_0 = (function () {
    /**
     * ui-tiles.js —— 麻将牌的内联 SVG 渲染器
     *
     * 为什么要现画而不是用图片/字体：
     *   1. 教程要交付成「双击即开的单文件 HTML」，不能带外部资源
     *   2. Unicode 麻将字符（U+1F000 区）在 Windows 上字体支持参差不齐，会掉成豆腐块
     *   3. 现画才能做「赤牌变红」「无效牌变灰」「高亮」这类教学态
     *
     * 索引约定（必须与 mahjong/engine 保持一致，不要改）：
     *   0–8   一萬～九萬 (m)
     *   9–17  一筒～九筒 (p)
     *   18–26 一索～九索 (s)
     *   27–33 東 南 西 北 白 發 中 (z)
     *   34/35/36 = 赤五萬 / 赤五筒 / 赤五索
     */

    const TILE_W = 40;
    const TILE_H = 56;

    const NUM_KANJI = ['一', '二', '三', '四', '五', '六', '七', '八', '九'];
    const HONOR_KANJI = ['東', '南', '西', '北', '白', '發', '中'];
    const SUIT_LABEL = ['萬', '筒', '索', '字'];

    const INK = '#242019';
    const RED = '#bd3a2c';
    const PIN_BLUE = '#1d5da6';
    const SOU_GREEN = '#1e7a4c';
    const FACE_BG = '#fdfbf3';
    const FACE_EDGE = '#c8bfa4';
    const BACK_BG = '#2f6b4f';

    /** 赤牌索引 → 本体索引 */
    function baseIdx(idx) {
      return idx === 34 ? 4 : idx === 35 ? 13 : idx === 36 ? 22 : idx;
    }
    function isRedIdx(idx) { return idx >= 34 && idx <= 36; }
    /** 本体索引 → 赤牌索引（只对 5m/5p/5s 有效，其余返回原值） */
    function redIdxOf(idx) {
      return idx === 4 ? 34 : idx === 13 ? 35 : idx === 22 ? 36 : idx;
    }

    function suitOf(idx) { const b = baseIdx(idx); return b < 9 ? 0 : b < 18 ? 1 : b < 27 ? 2 : 3; }
    function rankOf(idx) {
      const b = baseIdx(idx);
      return b < 27 ? (b % 9) + 1 : b - 26; // 字牌：東=1 … 中=7
    }

    /** 中文牌名 */
    function tileName(idx) {
      const r = rankOf(idx), s = suitOf(idx), red = isRedIdx(idx);
      if (s === 3) return HONOR_KANJI[r - 1];
      return (red ? '赤' : '') + NUM_KANJI[r - 1] + SUIT_LABEL[s];
    }
    /** 日麻标准记法，如 "5m"、"0p"(赤五筒)、"1z"(東) */
    function tileCode(idx) {
      const r = rankOf(idx), s = suitOf(idx);
      if (s === 3) return r + 'z';
      if (isRedIdx(idx)) return '0' + 'mps'[s];
      return r + 'mps'[s];
    }

    /** 计数数组 → 牌索引数组（升序） */
    function tilesFromCount(count) {
      const out = [];
      for (let i = 0; i < 34; i++) for (let n = 0; n < (count[i] || 0); n++) out.push(i);
      return out;
    }

    // ── 牌面生成 ─────────────────────────────────────────────────────

    /** 筒子：同心圆（外圈描边 + 实心内点），是真实牌面的简化 */
    function pin(cx, cy, r, color) {
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${FACE_BG}" stroke="${color}" stroke-width="${(r * 0.36).toFixed(2)}"/>`
           + `<circle cx="${cx}" cy="${cy}" r="${(r * 0.34).toFixed(2)}" fill="${color}"/>`;
    }

    const PIN_LAYOUT = {
      1: [[20, 28, 10.5]],
      2: [[20, 16, 7.2], [20, 40, 7.2]],
      3: [[9.5, 40, 6.4], [20, 28, 6.4], [30.5, 16, 6.4]],
      4: [[12.5, 17, 6.6], [27.5, 17, 6.6], [12.5, 39, 6.6], [27.5, 39, 6.6]],

     * @property {string} label 中文名
     * @property {boolean} ryanmen 是否两面听（平和条件之一）
     * @property {string} desc 说明
     */

    /**
     * @typedef {Object} FuItem
     * @property {string} label 加符项名称（中文，供教程直接显示）
     * @property {number} fu 该项符数
     * @property {string} [note] 备注（为什么这么算）
     */

    /**
     * @typedef {Object} FuResult
     * @property {number} fu 最终符数（已切上到 10，或特殊固定值 20 / 25 / 0）
     * @property {number} raw 加符项合计（未做「向上取整到 10」；特殊固定时可能不等于 fu）
     * @property {FuItem[]} items 逐项明细（教程用）
     * @property {boolean} isFixed 是否被规则固定为特殊值（平和自摸 20 / 七对子 25 / 役满 0）
     */

    /**
     * 归一化并校验 Context（fu.js 与 yaku.js 共用的入口校验）。
     *
     * 只做形状与取值校验，不做「是否和牌形」的业务判定；缺省的可选字段一律补成安全默认值，
     * 因此调用方只需要提供 `hand` / `melds` / `winTile` 三样必需信息。
     *
     * @param {object} ctx 和牌上下文（见 detectYaku 的 Context 约定）
     * @returns {object} 归一化后的新对象（不修改入参）
     * @throws {TypeError|RangeError} 形状非法（手牌不是 34 计数数组、副露结构错误、场风自风越界）时抛出
     */
    function normalizeContext(ctx) {
      if (ctx === null || typeof ctx !== 'object') {
        throw new TypeError('normalizeContext: ctx 必须是对象');
      }
      if (ctx.hand === undefined) throw new TypeError('normalizeContext: ctx.hand 缺失');
      if (ctx.winTile === undefined) throw new TypeError('normalizeContext: ctx.winTile 缺失');
      const hand = normalizeHand(ctx.hand);
      const melds = (ctx.melds === undefined || ctx.melds === null ? [] : validateMelds(ctx.melds)).map(
        (m) => ({ type: m.type, tiles: m.tiles.map(normalizeIndex) }),
      );
      const roundWind = toWind(ctx.roundWind, 'roundWind');
      const seatWind = toWind(ctx.seatWind, 'seatWind');
      return {
        hand,
        melds,
        winTile: normalizeIndex(ctx.winTile),
        isTsumo: ctx.isTsumo === true,
        roundWind,
        seatWind,
        isRiichi: ctx.isRiichi === true,
        isDoubleRiichi: ctx.isDoubleRiichi === true,
        isIppatsu: ctx.isIppatsu === true,
        isChankan: ctx.isChankan === true,
        chankanIsAnkan: ctx.chankanIsAnkan === true,
        isRinshan: ctx.isRinshan === true,
        isHaitei: ctx.isHaitei === true,
        isHoutei: ctx.isHoutei === true,
        isTenhou: ctx.isTenhou === true,
        isChiihou: ctx.isChiihou === true,
        isRenhou: ctx.isRenhou === true,
        doraIndicators: toIndexArray(ctx.doraIndicators, 'doraIndicators'),
        uraIndicators: toIndexArray(ctx.uraIndicators, 'uraIndicators'),
        redCount: toCount(ctx.redCount, 'redCount'),
        isNagashiMangan: ctx.isNagashiMangan === true,
        yakumanCount: toCount(ctx.yakumanCount, 'yakumanCount'),
      };
    }

    /**
     * 校验并归一风牌索引。
     *
     * @param {unknown} value 场风 / 自风
     * @param {string} name 字段名（报错用）
     * @returns {number} 27–30
     * @throws {RangeError} 非 27–30 的整数时抛出
     */
    function toWind(value, name) {
      const v = value === undefined || value === null ? WIND_EAST : value;
      if (!Number.isInteger(v) || v < WIND_EAST || v > WIND_NORTH) {
        throw new RangeError(`normalizeContext: ${name} 必须是 27–30（東南西北），收到 ${String(value)}`);
      }
      return v;
    }

    /**
     * 校验并归一牌索引数组（宝牌指示牌等）。
     *
     * @param {unknown} value 数组或空
     * @param {string} name 字段名
     * @returns {number[]} 归一化后的索引数组
     * @throws {TypeError|RangeError} 不是数组或含非法索引时抛出
     */
    function toIndexArray(value, name) {
      if (value === undefined || value === null) return [];
      if (!Array.isArray(value)) throw new TypeError(`normalizeContext: ${name} 必须是数组`);
      return value.map((v) => {
        try {
          return normalizeIndex(v);
        } catch (err) {
          throw new RangeError(`normalizeContext: ${name} 含非法牌索引 ${String(v)}（${err.message}）`);
        }
      });
    }

    /**
     * 校验并归一非负整数计数（赤牌张数等）。
     *
     * @param {unknown} value 计数
     * @param {string} name 字段名
     * @returns {number} 非负整数
     * @throws {RangeError} 非法时抛出
     */
    function toCount(value, name) {
      if (value === undefined || value === null) return 0;
      if (!Number.isInteger(value) || value < 0) {
        throw new RangeError(`normalizeContext: ${name} 必须是非负整数，收到 ${String(value)}`);
      }
      return value;
    }

    /**
     * 是否门清：只要没有吃 / 碰 / 明槓 / 加槓就是门清（**暗杠不算副露**，仍视为门清）。
     *
     * @param {Array<{type: string}>} melds 副露数组
     * @returns {boolean} 门清返回 true
     */
    function isMenzen(melds) {
      return (melds || []).every((m) => m.type === 'ankan');
    }

    /**
     * 把一条副露转成统一面子视图。
     *
     * @param {{type: string, tiles: number[]}} meld 副露
     * @returns {MentsuView} 面子视图
     */
    function meldToView(meld) {
      const tiles = meld.tiles.map(normalizeIndex);
      const isKan = meld.type === 'minkan' || meld.type === 'ankan' || meld.type === 'kakan';
      const isChi = meld.type === 'chi';
      const concealed = meld.type === 'ankan';
      return {
        kind: isChi ? 'shuntsu' : isKan ? 'kantsu' : 'koutsu',
        tile: isChi ? Math.min(...tiles) : tiles[0],
        tiles,
        concealed,
        isKan,
        open: !concealed,
        source: 'meld',
        meldType: meld.type,
      };
    }

    /**
     * 枚举和牌张在拆解中的全部合法「角色」。
     *
     * 角色取值：
     *   - `-1`           和牌张补成雀头（单骑听）
     *   - `i`（0 起）    和牌张位于 `decom.mentsu[i]` 内（该面子由和牌张补成）
     *
     * 同一张牌可能落在不同的面子里（例：`1111m23m…` 的 1m 既可能在 `111m` 也可能在 `123m`），
     * 不同角色会得到不同的听牌形与不同的明暗刻判定，因此**必须逐个枚举后取高点**
     * （yaku.js 会为每个角色各评估一次）。
     *
     * @param {object} ctx 归一化后的 Context
     * @param {{pair: number, mentsu: Array<{type: string, tiles: number[]}>}} decom 拆解方案
     * @returns {number[]} 角色数组（去重、雀头在最前、其余按下标升序）
     * @throws {RangeError} 和牌张不在任何面子 / 雀头中（拆解与和牌张不自洽）时抛出
     */
    function enumerateWinRoles(ctx, decom) {
      const w = ctx.winTile;
      const roles = [];
      if (decom.pair === w) roles.push(-1);
      for (let i = 0; i < decom.mentsu.length; i++) {
        if (decom.mentsu[i].tiles.includes(w)) roles.push(i);
      }
      if (roles.length === 0) {
        throw new RangeError(
          `enumerateWinRoles: 和牌张 ${tileToStr(w)} 不在拆解结果中（拆解与 winTile 不自洽）`,
        );
      }
      return roles;
    }

    /**
     * 用指定角色构建「面子统一视图」。
     *
     * 面子顺序固定为：**先副露（按 melds 顺序），后暗牌拆解（按 decom.mentsu 顺序）**。
     * 因此 `role` 是 `decom.mentsu` 的下标（与副露无关），-1 表示雀头。
     *
     * 荣和补成的刻子在这里被降级为明刻（§1.8(6)）：`concealed = false`，`open` 仍为 false
     * （它不是副露，不影响门清 / 断幺九等判定，只影响符数与暗刻计数）。
     *
     * @param {object} ctx 归一化后的 Context
     * @param {{pair: number, mentsu: Array<{type: string, tiles: number[]}>}} decom 拆解方案
     * @param {number} role 和牌张角色（-1 或 mentsu 下标）
     * @returns {HandView} 面子统一视图
     * @throws {RangeError} role 与拆解不自洽、或面子总数不是 4 时抛出
     */
    function buildViewWithRole(ctx, decom, role) {
      if (!Number.isInteger(role) || role < -1 || role >= decom.mentsu.length) {
        throw new RangeError(`buildViewWithRole: 非法角色 ${String(role)}`);
      }
      if (role === -1 && decom.pair !== ctx.winTile) {
        throw new RangeError('buildViewWithRole: role = -1 要求雀头就是和牌张（单骑听）');
      }
      if (role >= 0 && !decom.mentsu[role].tiles.includes(ctx.winTile)) {
        throw new RangeError('buildViewWithRole: 指定面子不含和牌张，与 winTile 不自洽');
      }
      /** @type {MentsuView[]} */
      const mentsu = ctx.melds.map(meldToView);
      for (let i = 0; i < decom.mentsu.length; i++) {
        const m = decom.mentsu[i];
        const tiles = m.tiles.map(normalizeIndex);
        const isWinMentsu = i === role;
        // 荣和补成的刻子算明刻；顺子照旧是暗顺子（天凤原文）
        const ronCompleted = isWinMentsu && m.type === 'koutsu' && !ctx.isTsumo;
        mentsu.push({
          kind: m.type,
          tile: m.type === 'shuntsu' ? Math.min(...tiles) : tiles[0],
          tiles,
          concealed: !ronCompleted,
          isKan: false,
          open: false,
          source: 'decom',
          ronCompleted,
        });
      }
      if (mentsu.length !== 4) {
        throw new RangeError(
          `buildViewWithRole: 面子数应为 4，实际 ${mentsu.length}（副露 ${ctx.melds.length} + 暗牌拆解 ${decom.mentsu.length}）`,
        );
      }
      return { pair: decom.pair, mentsu, isMenzen: isMenzen(ctx.melds), meldCount: ctx.melds.length, role };
    }

    /**
     * 判定和牌张在拆解中的听牌形（单骑 / 嵌张 / 边张 / 两面 / 双碰）。
     *
     * 判据（标准口径）：
     *   - 补成雀头 → 单骑；补成刻子 → 双碰；补成顺子则看位置：
     *     中间张 → 嵌张；`123` 的 3 或 `789` 的 7 → 边张；其余 → 两面。
     *
     * @param {object} ctx 归一化后的 Context
     * @param {{pair: number, mentsu: Array<{type: string, tiles: number[]}>}} decom 拆解方案
     * @param {number} role 和牌张角色
     * @returns {WaitInfo} 听牌形信息
     * @throws {RangeError} 角色与拆解不自洽时抛出
     */
    function classifyWinTile(ctx, decom, role) {
      const w = ctx.winTile;
      if (role === -1) {
        if (decom.pair !== w) throw new RangeError('classifyWinTile: role = -1 要求雀头就是和牌张');
        return {
          type: 'tanki',
          fu: 2,
          label: '单骑',
          ryanmen: false,
          desc: `和牌张 ${tileToStr(w)} 补成雀头（单骑听 +2 符）`,
        };
      }
      const m = decom.mentsu[role];
      if (!m) throw new RangeError(`classifyWinTile: 角色 ${String(role)} 越界`);
      const tiles = m.tiles.map(normalizeIndex);
      if (!tiles.includes(w)) {
        throw new RangeError('classifyWinTile: 指定面子不含和牌张，与 winTile 不自洽');
      }
      if (m.type === 'koutsu') {
        return {
          type: 'shanpon',
          fu: 0,
          label: '双碰',
          ryanmen: false,
          desc: `和牌张 ${tileToStr(w)} 补成刻子（双碰听 0 符；荣和时该刻子按明刻计）`,
        };
      }
      const rank = tiles[0] % 9; // 顺子在花色内的起始序号（0 = 123 … 6 = 789）
      if (tiles[1] === w) {
        return {
          type: 'kanchan',
          fu: 2,
          label: '嵌张',
          ryanmen: false,
          desc: `和牌张 ${tileToStr(w)} 是顺子的中间张（嵌张听 +2 符）`,
        };
      }
      if (tiles[2] === w) {
        if (rank === 0) {
          return {
            type: 'penchan',
            fu: 2,
            label: '边张',
            ryanmen: false,
            desc: `12${tileToStr(w)} 型，只能等 ${tileToStr(w)}（边张听 +2 符）`,
          };
        }
        return {
          type: 'ryanmen',
          fu: 0,
          label: '两面',
          ryanmen: true,
          desc: `和牌张 ${tileToStr(w)} 是顺子的高端张（两面听 0 符）`,
        };
      }
      if (rank === 6) {
        return {
          type: 'penchan',
          fu: 2,
          label: '边张',
          ryanmen: false,
          desc: `${tileToStr(w)}89 型，只能等 ${tileToStr(w)}（边张听 +2 符）`,
        };
      }
      return {
        type: 'ryanmen',
        fu: 0,
        label: '两面',
        ryanmen: true,
        desc: `和牌张 ${tileToStr(w)} 是顺子的低端张（两面听 0 符）`,
      };
    }

    /**
     * 雀头符明细。
     *
     * 雀头符 =（三元牌 ? 2 : 0）+（自风 ? 2 : 0）+（场风 ? 2 : 0），连风牌按两项各 2 相加；
     * `rules.renfonPairFu === 2` 时连风牌只算 2 符（少数线下规则）。
     *
     * @param {number} pair 雀头牌索引
     * @param {object} ctx 归一化后的 Context
     * @param {Readonly<Record<string, boolean|number>>} rules 规则集
     * @returns {{fu: number, label: string, note: string}} 明细
     */
    function pairFu(pair, ctx, rules) {
      if (pair >= DRAGON_START) {
        return {
          fu: 2,
          label: `三元牌（${DRAGON_NAMES[pair]}）`,
          note: '三元牌雀头 +2 符（§2.1）',
        };
      }
      const isSeat = pair === ctx.seatWind;
      const isRound = pair === ctx.roundWind;
      if (isSeat && isRound) {
        const fu = rules[RENFON_PAIR_FU] === 2 ? 2 : 4;
        return {
          fu,
          label: `连风牌（${WIND_NAMES[pair]}，自风 = 场风）`,
          note:
            fu === 4
              ? '自风与场风为同一种风牌，役牌雀头符各 +2 共 4 符（天凤 / 雀魂 / 雀姬口径，§2.4）'
              : '本规则集采用「连风牌雀头 2 符」的线下通用口径（§2.4）',
        };
      }
      if (isSeat) return { fu: 2, label: `自风牌（${WIND_NAMES[pair]}）`, note: '自风雀头 +2 符' };
      if (isRound) return { fu: 2, label: `场风牌（${WIND_NAMES[pair]}）`, note: '场风雀头 +2 符' };
      return {
        fu: 0,
        label: `无符雀头（${tileToStr(pair)}）`,
        note: pair >= HONOR_START ? '客风雀头 0 符' : '数牌雀头 0 符',
      };
    }

    /**
     * 雀头是否为役牌（三元牌 / 自风 / 场风）——平和的必要条件之一。
     *
     * @param {number} pair 雀头牌索引
     * @param {object} ctx 归一化后的 Context
     * @returns {boolean} 是役牌雀头返回 true
     */
    function isYakuhaiPair(pair, ctx) {
      return pair >= DRAGON_START || pair === ctx.seatWind || pair === ctx.roundWind;
    }

    /**
     * 单个面子的符数（顺子 0 符）。
     *
     * @param {MentsuView} m 面子视图
     * @returns {number} 符数（0 / 2 / 4 / 8 / 16 / 32）
     */
    function mentsuFu(m) {
      if (m.kind === 'shuntsu') return 0;
      const yaochu = m.tile >= HONOR_START || m.tile % 9 === 0 || m.tile % 9 === 8;
      if (m.kind === 'kantsu') {
        if (m.concealed) return yaochu ? 32 : 16;
        return yaochu ? 16 : 8;
      }
      if (m.concealed) return yaochu ? 8 : 4;
      return yaochu ? 4 : 2;
    }

    /**
     * 面子符的明细项（含中文标签；顺子返回 0 符项，便于教程展示「顺子 0 符」）。
     *
     * @param {MentsuView} m 面子视图
     * @returns {FuItem} 明细项
     */
    function mentsuFuItem(m) {
      const fu = mentsuFu(m);
      const yaochu = m.tile >= HONOR_START || m.tile % 9 === 0 || m.tile % 9 === 8;
      const kindLabel = m.kind === 'shuntsu' ? '顺子' : m.kind === 'kantsu' ? (m.concealed ? '暗槓' : '明槓') : m.concealed ? '暗刻' : '明刻';
      const label = `面子：${yaochu && m.kind !== 'shuntsu' ? '幺九' : ''}${kindLabel}（${
        m.kind === 'shuntsu' ? `${tileToStr(m.tiles[0])}${tileToStr(m.tiles[1])}${tileToStr(m.tiles[2])}` : tileToStr(m.tile)
      }）`;
      /** @type {string|undefined} */
      let note;
      if (m.kind !== 'shuntsu') {
        const base = yaochu ? '幺九牌（1/9 数牌 + 全部字牌）' : '中张牌（2–8）';
        if (m.kind === 'kantsu') {
          note = m.concealed ? `暗槓：${base} 32/16 符（§2.1）` : `明槓（含加槓）：${base} 16/8 符（§2.1）`;
        } else {
          note = m.concealed ? `暗刻：${base} 8/4 符` : `明刻：${base} 4/2 符`;
        }
        if (m.ronCompleted) note += '；荣和补成的刻子按明刻计（§1.8(6)）';
        else if (m.open) note += '；副露面子';
      }
      return { label, fu, ...(note ? { note } : {}) };
    }

    /**
     * 平和判定。
     *
     * 三条件缺一不可（§1.8(3)）：门清、4 面子全为顺子、雀头非役牌、听牌形为两面。
     * 注意：**任何副露（含暗杠）都不成立平和** —— 吃碰明槓加槓是副露；暗杠虽保留门清，
     * 但「4 面子全为顺子」这一条已经不满足。
     *
     * @param {object} ctx 归一化后的 Context
     * @param {{pair: number, mentsu: Array<{type: string, tiles: number[]}>, winMentsu?: number}} decom 拆解方案
     * @param {Readonly<Record<string, boolean|number>>} [rules] 规则集
     * @returns {boolean} 成立平和返回 true
     */
    function isPinfu(ctx, decom, rules) {
      resolveRules(rules); // 校验规则集（平和与规则集无关，但保持调用一致性）
      if (ctx.melds.length > 0) return false;
      if (decom.mentsu.some((m) => m.type !== 'shuntsu')) return false;
      if (isYakuhaiPair(decom.pair, ctx)) return false;
      const roles =
        decom.winMentsu === undefined ? enumerateWinRoles(ctx, decom) : [validateRole(ctx, decom, decom.winMentsu)];
      return roles.some((role) => classifyWinTile(ctx, decom, role).ryanmen);
    }

    /**
     * 校验并返回 `decom.winMentsu`。
     *
     * @param {object} ctx 归一化后的 Context
     * @param {{pair: number, mentsu: Array<{type: string, tiles: number[]}>}} decom 拆解方案
     * @param {number} role 角色
     * @returns {number} 原样返回 role
     * @throws {RangeError} 角色与拆解不自洽时抛出
     */
    function validateRole(ctx, decom, role) {
      if (!Number.isInteger(role) || role < -1 || role >= decom.mentsu.length) {
        throw new RangeError(`calcFu: decom.winMentsu = ${String(role)} 非法（应为 -1 或 0–${decom.mentsu.length - 1}）`);
      }
      if (role === -1 && decom.pair !== ctx.winTile) {
        throw new RangeError('calcFu: decom.winMentsu = -1 要求雀头即和牌张（单骑听）');
      }
      if (role >= 0 && !decom.mentsu[role].tiles.includes(ctx.winTile)) {
        throw new RangeError('calcFu: decom.winMentsu 指定的面子不含和牌张，与 winTile 不自洽');
      }
      return role;
    }

    /**
     * 未指定 `decom.winMentsu` 时，为拆解挑选一个默认的和牌张角色。
     *
     * 选择基准与「高点法」一致：**先比番（平和 +1 番优先），番相同再比符**。
     * 平和与符的取舍之所以放在这里，是因为「平和自摸 20 符」本身就是符数规则，
     * 两者必须用同一口径，否则会出现「判平和却按嵌张算符」的自相矛盾。
     *
     * @param {object} ctx 归一化后的 Context

     *   - `menzen` 是否门清（false 且该役有食下番数时取食下番数）
     *   - `multiplier` 役满倍数（仅役满用）
     *   - `note` 覆盖默认备注
     * @returns {{id: string, name: string, ja: string, han: number, isYakuman: boolean, closedOnly: boolean, hanOpen?: number, multiplier?: number, note?: string}}
     * @throws {RangeError} id 未定义时抛出（防止拼写错误静默产出空役）
     */
    function yakuEntry(id, opts = {}) {
      const d = YAKU_DEFS[id];
      if (!d) throw new RangeError(`yakuEntry: 未定义的役种 id "${id}"`);
      const multiplier = opts.multiplier === undefined ? 1 : opts.multiplier;
      const menzen = opts.menzen !== false;
      const han = d.yakuman
        ? YAKUMAN_HAN * multiplier
        : menzen || d.hanOpen === undefined
          ? d.han
          : d.hanOpen;
      return {
        id,
        name: d.name,
        ja: d.ja,
        han,
        isYakuman: d.yakuman,
        closedOnly: d.closedOnly,
        ...(d.hanOpen !== undefined ? { hanOpen: d.hanOpen } : {}),
        ...(d.yakuman ? { multiplier } : {}),
        ...(opts.note ?? d.note ? { note: opts.note ?? d.note } : {}),
      };
    }

    /**
     * 索引是否为幺九牌（内部快速版，入参已是 0–33）。
     *
     * @param {number} i 牌索引
     * @returns {boolean} 幺九牌返回 true
     */
    function isYaochuIdx(i) {
      return i >= HONOR_START || i % 9 === 0 || i % 9 === 8;
    }

    /**
     * 索引是否为老头牌（数牌 1 / 9）。
     *
     * @param {number} i 牌索引
     * @returns {boolean} 老头牌返回 true
     */
    function isTerminalIdx(i) {
      return i < HONOR_START && (i % 9 === 0 || i % 9 === 8);
    }

    /**
     * 手牌计数 → 「整手牌」计数（暗牌 + 副露展开）。
     *
     * 与 tiles.js 的 handWithMelds 的区别：这里**不做** 4 张上限校验，
     * 因为上游已经校验过、且此处只是统计用途（性能敏感）。
     *
     * @param {object} ctx 归一化后的 Context
     * @returns {number[]} 长度 34 的整手牌计数
     */
    function handWithMeldsCount(ctx) {
      const counts = cloneHand(ctx.hand);
      for (const m of ctx.melds) for (const t of m.tiles) counts[t] += 1;
      return counts;
    }

    /**
     * 统计宝牌番数（宝牌 + 里宝牌 + 赤宝牌）。
     *
     * 里宝牌只在立直（含两立直）时计入；赤牌张数由调用方给出（计数数组不区分赤 5）。
     *
     * @param {object} ctx 归一化后的 Context
     * @param {number[]} counts 整手牌计数（含副露）
     * @returns {number} 宝牌番数合计
     */
    function countDora(ctx, counts) {
      let n = 0;
      for (const ind of ctx.doraIndicators) n += counts[doraFromIndicator(ind)];
      if (ctx.isRiichi || ctx.isDoubleRiichi) {
        for (const ind of ctx.uraIndicators) n += counts[doraFromIndicator(ind)];
      }
      return n + ctx.redCount;
    }

    /**
     * 从手牌中减去一张和牌张（得到和牌前的 13 张形），用于国士十三面 / 纯正九莲的听牌形判定。
     *
     * @param {number[]} hand 归一化后的暗牌计数
     * @param {number} winTile 和牌张索引
     * @returns {number[]} 减一张后的计数数组
     * @throws {RangeError} 手中没有该牌时抛出
     */
    function subtractWinTile(hand, winTile) {
      const out = cloneHand(hand);
      if (out[winTile] <= 0) {
        throw new RangeError(`subtractWinTile: 手中没有和牌张 ${tileToStr(winTile)}`);
      }
      out[winTile] -= 1;
      return out;
    }

    /**
     * 抢槓成立性判定（含国士抢暗杠规则）。
     *
     * 加槓（kakan）被抢是常规抢槓，任何牌型都成立；**暗杠**只有国士无双在
     * `rules.kokushiChankanAnkan === true` 时才允许（§1.8(7)，天凤 / 雀魂相反）。
     *
     * @param {object} ctx 归一化后的 Context
     * @param {Readonly<Record<string, boolean|number>>} rules 规则集
     * @param {'standard'|'chiitoi'|'kokushi'} form 和牌形
     * @returns {boolean} 抢槓成立返回 true
     */
    function chankanAllowed(ctx, rules, form) {
      if (!ctx.isChankan) return false;
      if (!ctx.chankanIsAnkan) return true;
      return form === 'kokushi' && rules[KOKUSHI_CHANKAN_ANKAN] === true;
    }

    /**
     * 场景役（与具体牌型无关的役：立直系、自摸、偶然役）。
     *
     * @param {object} ctx 归一化后的 Context
     * @param {Readonly<Record<string, boolean|number>>} rules 规则集
     * @param {boolean} menzen 是否门清
     * @param {'standard'|'chiitoi'|'kokushi'} form 和牌形（抢槓规则用）
     * @returns {Array<object>} 役种条目
     */
    function situationalYaku(ctx, rules, menzen, form) {
      const out = [];
      if (menzen && ctx.isDoubleRiichi) out.push(yakuEntry('doubleRiichi'));
      else if (menzen && ctx.isRiichi) out.push(yakuEntry('riichi'));
      const riichiLike = menzen && (ctx.isRiichi || ctx.isDoubleRiichi);
      // 一発与岭上开花、海底摸月不复合（§1.1）
      if (ctx.isIppatsu && riichiLike && !ctx.isRinshan && !ctx.isHaitei) out.push(yakuEntry('ippatsu'));
      if (menzen && ctx.isTsumo) out.push(yakuEntry('menzenTsumo'));
      if (chankanAllowed(ctx, rules, form)) out.push(yakuEntry('chankan'));
      if (ctx.isRinshan) out.push(yakuEntry('rinshan'));
      if (ctx.isHaitei) out.push(yakuEntry('haitei'));
      if (ctx.isHoutei) out.push(yakuEntry('houtei'));
      if (rules[RENHOU] && menzen && ctx.isRenhou && !ctx.isTsumo) out.push(yakuEntry('renhou'));
      return out;
    }

    /**
     * 役满场景项（天和 / 地和）。
     *
     * @param {object} ctx 归一化后的 Context
     * @param {boolean} menzen 是否门清
     * @returns {Array<object>} 役满条目
     */
    function situationalYakuman(ctx, menzen) {
      const out = [];
      if (menzen && ctx.isTenhou) out.push(yakuEntry('tenhou'));
      if (menzen && ctx.isChiihou) out.push(yakuEntry('chiihou'));
      return out;
    }

    /**
     * 双倍役满开关下的倍数。
     *
     * @param {Readonly<Record<string, boolean|number>>} rules 规则集
     * @param {boolean} isDouble 该役是否属于双倍候选
     * @returns {number} 1 或 2
     */
    function doubleMultiplier(rules, isDouble) {
      return isDouble && rules[DOUBLE_YAKUMAN] ? 2 : 1;
    }

    /**
     * 统计「相同顺子」的对数（一杯口 = 1 对，二杯口 = 2 对）。
     *
     * 按 §4③ 的规则：相同顺子组数 n 只贡献 `floor(n / 2)` 对，
     * 所以 `123m×3` 只算 1 对（一杯口），`123m×4` 算 2 对（二杯口，且正是 §1.8(8) 允许的 4 张同牌形态）。
     *
     * @param {Array<{kind: string, tile: number}>} mentsu 面子视图
     * @returns {number} 相同顺子对数
     */
    function identicalShuntsuPairs(mentsu) {
      const cnt = new Map();
      for (const m of mentsu) {
        if (m.kind !== 'shuntsu') continue;
        cnt.set(m.tile, (cnt.get(m.tile) || 0) + 1);
      }
      let pairs = 0;
      for (const n of cnt.values()) pairs += Math.floor(n / 2);
      return pairs;
    }

    /**
     * 三色同顺判定。
     *
     * @param {Array<{kind: string, tile: number}>} mentsu 面子视图
     * @returns {boolean} 成立返回 true
     */
    function hasSanshokuDoujun(mentsu) {
      const starts = new Set(mentsu.filter((m) => m.kind === 'shuntsu').map((m) => m.tile));
      for (let rank = 0; rank <= 6; rank++) {
        if (starts.has(rank) && starts.has(9 + rank) && starts.has(18 + rank)) return true;
      }
      return false;
    }

    /**
     * 一气通贯判定（同一花色 123 + 456 + 789）。
     *
     * @param {Array<{kind: string, tile: number}>} mentsu 面子视图
     * @returns {boolean} 成立返回 true
     */
    function hasIttsu(mentsu) {
      const starts = new Set(mentsu.filter((m) => m.kind === 'shuntsu').map((m) => m.tile));
      for (let s = 0; s < 3; s++) {
        if (starts.has(s * 9) && starts.has(s * 9 + 3) && starts.has(s * 9 + 6)) return true;
      }
      return false;
    }

    /**
     * 三色同刻判定。
     *
     * @param {Array<{kind: string, tile: number}>} mentsu 面子视图
     * @returns {boolean} 成立返回 true
     */
    function hasSanshokuDoukou(mentsu) {
      const tiles = new Set(mentsu.filter((m) => m.kind !== 'shuntsu').map((m) => m.tile));
      for (let r = 0; r < 9; r++) {
        if (tiles.has(r) && tiles.has(9 + r) && tiles.has(18 + r)) return true;
      }
      return false;
    }

    /**
     * 花色 / 字牌使用情况。
     *
     * @param {number[]} counts 整手牌计数
     * @returns {{suits: Set<number>, hasHonor: boolean, fullyHonor: boolean}} 统计结果
     */
    function suitUsage(counts) {
      const suits = new Set();
      let hasHonor = false;
      let allHonor = true;
      let any = false;
      for (let i = 0; i < HAND_SIZE; i++) {
        if (counts[i] === 0) continue;
        any = true;
        if (i >= HONOR_START) hasHonor = true;
        else {
          suits.add(Math.floor(i / 9));
          allHonor = false;
        }
      }
      return { suits, hasHonor, fullyHonor: any && allHonor };
    }

    /**
     * 是否全是幺九牌（混老头 / 清老头的必要条件）。
     *
     * @param {number[]} counts 整手牌计数
     * @returns {boolean} 全是幺九牌返回 true
     */
    function allYaochu(counts) {
      for (let i = 0; i < HAND_SIZE; i++) {
        if (counts[i] > 0 && !isYaochuIdx(i)) return false;
      }
      return true;
    }

    /**
     * 是否全是老头牌（清老头）。
     *
     * @param {number[]} counts 整手牌计数
     * @returns {boolean} 全是老头牌返回 true
     */
    function allTerminal(counts) {
      for (let i = 0; i < HAND_SIZE; i++) {
        if (counts[i] > 0 && !isTerminalIdx(i)) return false;
      }
      return true;
    }

    /**
     * 是否全是绿色牌（绿一色）。
     *
     * @param {number[]} counts 整手牌计数
     * @returns {boolean} 成立返回 true
     */
    function allGreen(counts) {
      for (let i = 0; i < HAND_SIZE; i++) {
        if (counts[i] > 0 && !GREEN_TILES.has(i)) return false;
      }
      return true;
    }

    /**
     * 无役时的说明（供教程显示「为什么不能和」）。
     *
     * @param {object} ctx 归一化后的 Context
     * @param {Readonly<Record<string, boolean|number>>} rules 规则集
     * @returns {string[]} 说明数组
     */
    function noYakuNotes(ctx, rules) {
      const notes = [];
      if (ctx.doraIndicators.length > 0) {
        notes.push('宝牌 / 赤宝牌 / 里宝牌**不计入起和番**：没有真役时不能和牌（§3.7）');
      }
      if (!isMenzen(ctx.melds) && rules[KUITAN] === false) {
        notes.push('本规则集为「无食断」：副露后断幺九不成立，请检查是否只靠断幺九');
      }
      return notes;
    }

    /**
     * 空结果（非和牌形 / 规则禁止的和牌）。
     *
     * @param {string[]} notes 说明
     * @param {number} doraHan 宝牌番数（非和牌形时也如实报出，便于排查）
     * @returns {object} detectYaku 的返回结构
     */
    function emptyResult(notes, doraHan = 0) {
      return {
        list: [],
        han: 0,
        yakumanCount: 0,
        isNagashi: false,
        hasYaku: false,
        doraHan,
        totalHan: 0,
        isKazoeYakuman: false,
        form: null,
        decomposition: null,
        fu: 0,
        fuDetail: null,
        notes,
      };
    }

    /**
     * 由「役种列表 + 役满倍数」组装中间结果。
     *
     * @param {Array<object>} list 役种条目
     * @param {number} yakumanCount 役满倍数
     * @returns {{list: Array<object>, han: number, yakumanCount: number}} 中间结果
     */
    function summarize(list, yakumanCount) {
      let han = 0;
      for (const e of list) {
        if (!e.isYakuman) han += e.han;
      }
      return { list, han, yakumanCount };
    }

    /**
     * 评估标准形（4 面子 + 1 雀头）的一个具体拆解 + 和牌张角色。
     *
     * @param {object} ctx 归一化后的 Context
     * @param {{pair: number, mentsu: Array<object>, winMentsu: number}} decom 拆解（含角色）
     * @param {Readonly<Record<string, boolean|number>>} rules 规则集
     * @param {number[]} counts 整手牌计数
     * @returns {{list: Array<object>, han: number, yakumanCount: number}} 评估结果
     */
    function evalStandard(ctx, decom, rules, counts) {
      const view = buildHandView(ctx, decom, rules);
      const wait = classifyWinTile(ctx, decom, decom.winMentsu);
      const menzen = view.isMenzen;
      const men = view.mentsu;
      const pair = view.pair;

      const shuntsu = men.filter((m) => m.kind === 'shuntsu');
      const koutsuLike = men.filter((m) => m.kind !== 'shuntsu');
      const concealedKoutsu = koutsuLike.filter((m) => m.concealed);
      const kans = men.filter((m) => m.isKan);
      const dragons = koutsuLike.filter((m) => m.tile >= DRAGON_START);
      const winds = koutsuLike.filter((m) => m.tile >= WIND_EAST && m.tile <= WIND_NORTH);

      // ---------- 役满（先判役满：役满不与任何非役满役、也不与宝牌复合，§4⑩） ----------
      const usage = suitUsage(counts);
      const yk = situationalYakuman(ctx, menzen);
      if (dragons.length === 3) yk.push(yakuEntry('daisangen'));
      if (winds.length === 4) {
        yk.push(yakuEntry('daisuushii', { multiplier: doubleMultiplier(rules, true) }));
      } else if (winds.length === 3 && pair >= WIND_EAST && pair <= WIND_NORTH) {
        yk.push(yakuEntry('shousuushii'));
      }
      if (concealedKoutsu.length === 4) {
        if (wait.type === 'tanki') {
          yk.push(yakuEntry('suuankouTanki', { multiplier: doubleMultiplier(rules, true) }));
        } else {
          yk.push(yakuEntry('suuankou'));
        }
      }
      if (kans.length === 4) yk.push(yakuEntry('suukantsu'));
      if (usage.fullyHonor) yk.push(yakuEntry('tsuuiisou'));
      else if (allTerminal(counts)) yk.push(yakuEntry('chinroutou'));
      if (allGreen(counts)) yk.push(yakuEntry('ryuuiisou'));

      // 九莲宝灯（门清限定；暗杠会破坏牌型，故要求完全没有副露）
      if (menzen && ctx.melds.length === 0) {
        const chuuren = findChuuren(ctx.hand);
        if (chuuren >= 0) {
          const hand13 = subtractWinTile(ctx.hand, ctx.winTile);
          const pure = isPureChuuren13(hand13, chuuren);
          yk.push(yakuEntry(pure ? 'chuurenPure' : 'chuuren', pure ? { multiplier: doubleMultiplier(rules, true) } : {}));
        }
      }

      if (yk.length > 0) {
        let count = 0;
        for (const e of yk) count += e.multiplier ?? 1;
        return summarize(yk, count);
      }

      // ---------- 非役满 ----------
      const list = situationalYaku(ctx, rules, menzen, 'standard');

      if (isPinfu(ctx, decom, rules)) list.push(yakuEntry('pinfu'));

      if (menzen) {
        const pairs = identicalShuntsuPairs(men);
        // 一杯口与二杯口互斥：2 对只计二杯口（§1.8(1)）
        if (pairs >= 2) list.push(yakuEntry('ryanpeikou'));
        else if (pairs === 1) list.push(yakuEntry('iipeikou'));
      }

      // 断幺九（含食断规则）
      if (!counts.some((n, i) => n > 0 && isYaochuIdx(i))) {
        if (menzen || rules[KUITAN]) list.push(yakuEntry('tanyao', { menzen }));
      }

      // 役牌（可叠加：连风刻子 = 场风 + 自风 = 2 番）
      for (const m of koutsuLike) {
        if (m.tile === 31) list.push(yakuEntry('yakuhaiHaku'));
        else if (m.tile === 32) list.push(yakuEntry('yakuhaiHatsu'));
        else if (m.tile === 33) list.push(yakuEntry('yakuhaiChun'));
        if (m.tile === ctx.roundWind) list.push(yakuEntry('yakuhaiRoundWind'));
        if (m.tile === ctx.seatWind) list.push(yakuEntry('yakuhaiSeatWind'));
      }

      if (hasSanshokuDoujun(men)) list.push(yakuEntry('sanshoku', { menzen }));
      if (hasIttsu(men)) list.push(yakuEntry('ittsu', { menzen }));
      if (hasSanshokuDoukou(men)) list.push(yakuEntry('sanshokuDoukou'));

      // 全带系：所有面子 + 雀头都含幺九牌
      if (shuntsu.length > 0) {
        const sets = [...men.map((m) => ({ kind: m.kind, tile: m.tile })), { kind: 'pair', tile: pair }];
        const allHaveYaochu = sets.every((s) =>
          s.kind === 'shuntsu' ? s.tile % 9 === 0 || s.tile % 9 === 6 : isYaochuIdx(s.tile),
        );
        const allHaveTerminal = sets.every((s) =>
          s.kind === 'shuntsu' ? s.tile % 9 === 0 || s.tile % 9 === 6 : isTerminalIdx(s.tile),
        );
        if (allHaveTerminal && !usage.hasHonor) list.push(yakuEntry('junchan', { menzen }));
        else if (allHaveYaochu && usage.hasHonor) list.push(yakuEntry('chanta', { menzen }));
      }

      if (kans.length === 3) list.push(yakuEntry('sankantsu'));
      if (shuntsu.length === 0) list.push(yakuEntry('toitoi'));
      if (concealedKoutsu.length === 3) list.push(yakuEntry('sanankou'));
      if (dragons.length === 2 && pair >= DRAGON_START) list.push(yakuEntry('shousangen'));

      // 混老头：全部幺九牌，且既有字牌又有老头牌（全是字牌属字一色，已在役满短路）
      if (allYaochu(counts)) {
        const hasTerminal = counts.some((n, i) => n > 0 && isTerminalIdx(i));
        if (usage.hasHonor && hasTerminal) list.push(yakuEntry('honroutou'));
      }

      if (usage.suits.size === 1) {
        if (usage.hasHonor) list.push(yakuEntry('honitsu', { menzen }));
        else list.push(yakuEntry('chinitsu', { menzen }));
      }

      return summarize(list, 0);
    }

    /**
     * 求九莲宝灯所在花色。
     *
     * 条件：整手牌只由一种数牌组成，且该花色计数为 1 与 9 各 ≥3、2–8 各 ≥1（共 14 张）。
     *
     * @param {number[]} hand 归一化后的暗牌计数（九莲必须门清无副露，故直接用暗牌）
     * @returns {number} 花色编号（0/1/2）；不成立返回 -1
     */
    function findChuuren(hand) {
      for (let s = 0; s < 3; s++) {
        const c = [];
        let total = 0;
        for (let k = 0; k < 9; k++) {
          c[k] = hand[s * 9 + k];
          total += c[k];
        }
        if (total !== 14) continue;
        if (c[0] < 3 || c[8] < 3) continue;
        let ok = true;
        for (let k = 1; k <= 7; k++) {
          if (c[k] < 1) {
            ok = false;
            break;
          }
        }
        if (ok) return s;
      }
      return -1;
    }

    /**
     * 13 张手牌是否为「纯正九莲宝灯」的听牌形（1112345678999，九面听）。
     *
     * @param {number[]} hand13 和牌前的 13 张计数
     * @param {number} suit 花色编号
     * @returns {boolean} 是纯正九莲的 13 张形返回 true
     */
    function isPureChuuren13(hand13, suit) {
      const c = [];
      let total = 0;
      for (let k = 0; k < 9; k++) {
        c[k] = hand13[suit * 9 + k];
        total += c[k];
      }
      if (total !== 13) return false;
      if (c[0] !== 3 || c[8] !== 3) return false;
      for (let k = 1; k <= 7; k++) {
        if (c[k] !== 1) return false;
      }
      return true;
    }

    /**
     * 评估七对子形。
     *
     * @param {object} ctx 归一化后的 Context
     * @param {Readonly<Record<string, boolean|number>>} rules 规则集
     * @param {number[]} counts 整手牌计数
     * @returns {{list: Array<object>, han: number, yakumanCount: number}} 评估结果
     */
    function evalChiitoi(ctx, rules, counts) {
      const yk = situationalYakuman(ctx, true);
      const { fullyHonor } = suitUsage(counts);
